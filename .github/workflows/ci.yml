name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependency
        run: python -m pip install --upgrade pip lark

      - name: Grammar lock
        run: python ailang.py grammar --expect 75b9a04d8fb4fa77

      - name: Selftest (offline, no keys)
        run: python ailang.py selftest

      - name: .ai test suites
        run: python ailang.py test

      - name: Formatter is canonical
        run: python ailang.py fmt . --check

      - name: Attention report (mock, $0)
        run: python ailang.py flow examples/org_review.ai --json

      - name: Payroll (mock, $0)
        run: python ailang.py payroll examples/org_review.ai --json --budget 1.0

      - name: Contracts
        run: python ailang.py contract examples/org_review.ai --json

      - name: Audit (one verdict)
        run: python ailang.py audit examples corpus tests --json --strict

      - name: Journal and replay
        run: |
          python ailang.py run examples/org_review.ai --journal ci.jsonl
          python ailang.py replay ci.jsonl --step
          python ailang.py replay ci.jsonl --json

      - name: Demo runs offline
        run: python ailang.py demo
